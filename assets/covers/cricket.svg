<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320"
     width="240" height="320" role="img" aria-label="Cricket">
  <defs>
    <linearGradient id="bg-cricket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10513f"/>
      <stop offset="100%" stop-color="#03150e"/>
    </linearGradient>
    <radialGradient id="glow-cricket" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim-cricket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".82"/>
    </linearGradient>
  </defs>

  <rect width="240" height="320" fill="url(#bg-cricket)"/>
  <rect width="240" height="320" fill="url(#glow-cricket)"/>
  <text x="120" y="150" font-size="86" text-anchor="middle"
        font-family="Segoe UI Emoji, sans-serif" opacity=".92">🏏</text>
  <rect y="224" width="240" height="96" fill="url(#scrim-cricket)"/>
  <text x="16" y="280" fill="#fff" font-family="Segoe UI, Roboto, sans-serif"
        font-size="26" font-weight="800" letter-spacing="-.5">Cricket</text>
  <text x="16" y="300" fill="#9aa4b2" font-family="Segoe UI, Roboto, sans-serif"
        font-size="11" font-weight="700" letter-spacing="1.6">COMING SOON</text>
</svg>
