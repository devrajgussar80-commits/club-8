<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320"
     width="240" height="320" role="img" aria-label="Chicken Road">
  <defs>
    <linearGradient id="bg-chick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3a12"/>
      <stop offset="100%" stop-color="#140f06"/>
    </linearGradient>
    <radialGradient id="glow-chick" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim-chick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".82"/>
    </linearGradient>
  </defs>

  <rect width="240" height="320" fill="url(#bg-chick)"/>
  <rect width="240" height="320" fill="url(#glow-chick)"/>
  <rect x="0" y="70" width="240" height="150" fill="#5d5a5a"/>
  <g stroke="#f2f2f2" stroke-width="5" stroke-dasharray="16 14" opacity=".85">
    <line x1="72" y1="70" x2="72" y2="220"/>
    <line x1="144" y1="70" x2="144" y2="220"/>
  </g>
  <rect x="96" y="96" width="34" height="56" rx="7" fill="#e23b3b"/>
  <rect x="100" y="104" width="26" height="18" rx="4" fill="#2a2a2a" opacity=".7"/>
  <rect x="168" y="150" width="34" height="56" rx="7" fill="#3b7de2"/>
  <g transform="translate(40 168)">
    <ellipse cx="0" cy="26" rx="18" ry="5" fill="#000" opacity=".4"/>
    <circle cx="0" cy="0" r="20" fill="#fff3c9"/>
    <circle cx="7" cy="-5" r="3" fill="#222"/>
    <path d="M18 0 L30 5 L18 9 Z" fill="#f2a13c"/>
    <path d="M-4 -20 q6 -10 12 0" fill="#e23b3b"/>
  </g>
  <rect y="224" width="240" height="96" fill="url(#scrim-chick)"/>
  <text x="16" y="280" fill="#fff" font-family="Segoe UI, Roboto, sans-serif"
        font-size="26" font-weight="800" letter-spacing="-.5">Chicken Road</text>
  <text x="16" y="300" fill="#ffd76a" font-family="Segoe UI, Roboto, sans-serif"
        font-size="11" font-weight="700" letter-spacing="1.6">CROSS &amp; CASH OUT</text>
</svg>
