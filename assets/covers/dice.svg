<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320"
     width="240" height="320" role="img" aria-label="Dice Roll">
  <defs>
    <linearGradient id="bg-dice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c5c7e"/>
      <stop offset="100%" stop-color="#05131d"/>
    </linearGradient>
    <radialGradient id="glow-dice" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim-dice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".82"/>
    </linearGradient>
  </defs>

  <rect width="240" height="320" fill="url(#bg-dice)"/>
  <rect width="240" height="320" fill="url(#glow-dice)"/>
  <g transform="translate(120 128)">
    <ellipse cx="0" cy="72" rx="70" ry="12" fill="#000" opacity=".45"/>
    <g transform="rotate(-14)">
      <rect x="-58" y="-58" width="116" height="116" rx="22" fill="#fffdf5"/>
      <rect x="-58" y="-58" width="116" height="116" rx="22" fill="none"
            stroke="#c9bfa6" stroke-width="2"/>
      <circle cx="-31.2" cy="-31.2" r="11.1" fill="#15151a"/><circle cx="31.2" cy="-31.2" r="11.1" fill="#15151a"/><circle cx="0.0" cy="0.0" r="11.1" fill="#15151a"/><circle cx="-31.2" cy="31.2" r="11.1" fill="#15151a"/><circle cx="31.2" cy="31.2" r="11.1" fill="#15151a"/>
    </g>
    <g transform="translate(58 44) rotate(18) scale(.55)">
      <rect x="-58" y="-58" width="116" height="116" rx="22" fill="#ffd76a"/>
      <circle cx="-31.2" cy="-31.2" r="11.1" fill="#3a2600"/><circle cx="31.2" cy="31.2" r="11.1" fill="#3a2600"/>
    </g>
  </g>
  <rect y="224" width="240" height="96" fill="url(#scrim-dice)"/>
  <text x="16" y="280" fill="#fff" font-family="Segoe UI, Roboto, sans-serif"
