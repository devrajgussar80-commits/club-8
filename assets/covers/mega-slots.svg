      <stop offset="0%" stop-color="#12467a"/>
      <stop offset="100%" stop-color="#04101c"/>
    </linearGradient>
    <radialGradient id="glow-mega" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim-mega" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".82"/>
    </linearGradient>
  </defs>

  <rect width="240" height="320" fill="url(#bg-mega)"/>
  <rect width="240" height="320" fill="url(#glow-mega)"/>
  <g transform="translate(16 66)">
