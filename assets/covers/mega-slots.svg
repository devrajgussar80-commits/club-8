      <rect x="48" y="8" width="36" height="94" rx="7" fill="#e9f2ff"/>
      <rect x="88" y="8" width="36" height="94" rx="7" fill="#e9f2ff"/>
      <rect x="128" y="8" width="36" height="94" rx="7" fill="#e9f2ff"/>
      <rect x="168" y="8" width="32" height="94" rx="7" fill="#e9f2ff"/>
