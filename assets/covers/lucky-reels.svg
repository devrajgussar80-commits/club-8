<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320"
     width="240" height="320" role="img" aria-label="Lucky Reels">
  <defs>
    <linearGradient id="bg-reels" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a1338"/>
      <stop offset="100%" stop-color="#28091b"/>
    </linearGradient>
    <radialGradient id="glow-reels" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim-reels" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".82"/>
    </linearGradient>
  </defs>

  <rect width="240" height="320" fill="url(#bg-reels)"/>
  <rect width="240" height="320" fill="url(#glow-reels)"/>
  <g transform="translate(28 62)">
    <rect width="184" height="118" rx="14" fill="#1b0d18" opacity=".85"/>
    <g font-size="38" text-anchor="middle" font-family="Segoe UI Emoji, sans-serif">
      <rect x="10" y="10" width="52" height="98" rx="9" fill="#efe6ff"/>
      <rect x="66" y="10" width="52" height="98" rx="9" fill="#efe6ff"/>
      <rect x="122" y="10" width="52" height="98" rx="9" fill="#efe6ff"/>
      <text x="36" y="52">🍒</text><text x="92" y="52">🍒</text><text x="148" y="52">🍒</text>
      <text x="36" y="98" opacity=".45">🔔</text>
      <text x="92" y="98" opacity=".45">💎</text>
      <text x="148" y="98" opacity=".45">7️⃣</text>
    </g>
    <rect x="4" y="46" width="176" height="26" rx="6" fill="none"
          stroke="#ffd76a" stroke-width="3" opacity=".9"/>
  </g>
  <rect y="224" width="240" height="96" fill="url(#scrim-reels)"/>
  <text x="16" y="280" fill="#fff" font-family="Segoe UI, Roboto, sans-serif"
        font-size="26" font-weight="800" letter-spacing="-.5">Lucky Reels</text>
  <text x="16" y="300" fill="#ffd76a" font-family="Segoe UI, Roboto, sans-serif"
        font-size="11" font-weight="700" letter-spacing="1.6">3×3 · 5 PAYLINES</text>
</svg>
