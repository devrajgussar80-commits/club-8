      <rect x="54" y="116" width="42" height="42" rx="8"/>
      <rect x="102" y="116" width="42" height="42" rx="8"/>
      <rect x="54" y="164" width="42" height="36" rx="8"/>
      <rect x="102" y="164" width="42" height="36" rx="8"/>
